version: "0.1"
description: "遗留数据脚本治理工作流的子代理角色配置。主代理读取本文件后，可据此生成具体子代理任务书。"
owner_skill: "legacy-data-modernization-workflow"
principles:
  - "子代理只处理边界清晰、可独立验收的任务。"
  - "子代理优先产出文档、表格、清单、测试建议和风险问题项。"
  - "子代理不得直接执行发布、回滚、删除、覆盖旧输出或修改生产配置。"
  - "主代理保留最终判断、冲突解决和交付口径统一权。"
roles:
  - id: "entrypoint-explorer"
    display_name: "入口探索子代理"
    skill: "repo-entrypoint-mapper"
    delegation_level: "strong"
    when_to_use: "仓库入口、运行参数、配置文件或调度路径不清晰，需要扫描大量文件时。"
    allowed_actions:
      - "读取仓库文件、配置、脚本和文档。"
      - "搜索入口、命令、调度配置和调用链。"
      - "生成入口地图和未知项清单。"
    forbidden_actions:
      - "修改、删除或移动源码文件。"
      - "判断某段代码可以安全删除。"
      - "直接决定后续实现方案。"
    required_outputs:
      - "入口地图。"
      - "调用链摘要。"
      - "已确认事实、推断结论和待确认问题。"
      - "影响后续节点的风险项。"
  - id: "consumer-contract-explorer"
    display_name: "下游契约子代理"
    skill: "consumer-contract-mapper"
    delegation_level: "strong"
    when_to_use: "输出消费者分散在脚本、报表、字段引用或外部任务中，需要独立梳理下游契约时。"
    allowed_actions:
      - "搜索输出路径、文件名、字段名和报表名。"
      - "梳理直接消费者和疑似消费者。"
      - "草拟输出契约表和兼容性测试建议。"
    forbidden_actions:
      - "修改输出结构或下游代码。"
      - "将未知消费者判定为不存在。"
      - "批准破坏性契约变更。"
    required_outputs:
      - "消费者契约表。"
      - "关键消费者和未知消费者清单。"
      - "风险等级和验证建议。"
      - "需要主代理或用户确认的问题。"
  - id: "legacy-baseline-builder"
    display_name: "旧行为基线子代理"
    skill: "legacy-behavior-characterizer"
    delegation_level: "strong"
    when_to_use: "需要运行旧路径、整理基准输出、提炼特征测试或区分确认行为和推断行为时。"
    allowed_actions:
      - "在隔离目录中运行不带生产副作用的旧路径。"
      - "整理输入样例、基准输出和特征测试草案。"
      - "标记无法复现、只能推断或存在歧义的旧行为。"
    forbidden_actions:
      - "修改旧逻辑来让测试通过。"
      - "覆盖生产输出或真实下游文件。"
      - "把推断行为当成确认事实。"
    required_outputs:
      - "基准输入和基准输出来源。"
      - "特征测试清单。"
      - "确认行为、推断行为和异常行为分类。"
      - "进入重构前仍缺失的基线风险。"
  - id: "dirty-data-fixture-drafter"
    display_name: "脏数据样例子代理"
    skill: "dirty-data-case-designer"
    delegation_level: "controlled"
    when_to_use: "需要快速构造覆盖停牌、重复行、空字段、多股票和跨行业的最小样例时。"
    allowed_actions:
      - "草拟 CSV 输入样例。"
      - "给出样例对应的预期清洗和计算行为。"
      - "指出需要统一的业务规则。"
    forbidden_actions:
      - "独自决定缺失交易日是否前向填充。"
      - "独自决定重复行保留策略。"
      - "修改旧输出兼容规则。"
    required_outputs:
      - "样例行和覆盖场景。"
      - "每个样例对应的预期行为。"
      - "需要主代理或用户确认的业务规则。"
      - "与旧输出兼容性相关的风险提示。"
  - id: "refactor-slice-drafter"
    display_name: "重构切片子代理"
    skill: "refactor-slicer"
    delegation_level: "controlled"
    when_to_use: "需要先草拟小步重构和功能扩展切片，但最终顺序仍需主代理确认时。"
    allowed_actions:
      - "提出候选切片计划。"
      - "标注无行为变化重构和行为变更。"
      - "建议测试和审查重点。"
    forbidden_actions:
      - "把大范围重写作为默认方案。"
      - "合并结构重构和用户可见行为变更。"
      - "直接决定实现顺序或删除旧路径。"
    required_outputs:
      - "候选切片列表。"
      - "每个切片的风险、测试和回滚影响。"
      - "需要主代理确认的顺序依赖。"
      - "不建议采用的大范围重写点及原因。"
  - id: "compatibility-auditor"
    display_name: "兼容性审查子代理"
    skill: "compatibility-reviewer"
    delegation_level: "strong"
    when_to_use: "设计或代码变更已经形成，需要独立审查下游兼容性风险时。"
    allowed_actions:
      - "阅读设计、代码差异、消费者契约和测试结果。"
      - "输出兼容性风险问题项。"
      - "建议阻断发布的问题和必须补齐的测试。"
    forbidden_actions:
      - "直接修改代码或测试。"
      - "批准破坏性变更。"
      - "将缺失证据的兼容性判断标为通过。"
    required_outputs:
      - "按严重程度排序的问题项。"
      - "每个问题项对应的契约或未知消费者风险。"
      - "必须修复项、可接受剩余风险和开放问题。"
      - "发布前验证清单。"
  - id: "gray-release-designer"
    display_name: "灰度发布子代理"
    skill: "gray-release-planner"
    delegation_level: "strong"
    when_to_use: "需要综合运行窗口、监控指标、下游验证、回滚和沟通策略时。"
    allowed_actions:
      - "草拟发布阶段。"
      - "设计监控指标、阈值和回滚触发条件。"
      - "整理下游验证和沟通清单。"
    forbidden_actions:
      - "直接执行发布、回滚或修改调度配置。"
      - "决定灰度是否通过。"
      - "将未知负责人或未知下游当成已确认。"
    required_outputs:
      - "分阶段灰度计划。"
      - "每阶段进入、暂停和回滚条件。"
      - "指标阈值和验证方法。"
      - "待确认负责人、下游消费者和运行窗口。"
handoff_template:
  task_goal: "说明本子代理任务要解决的问题。"
  input_materials: "列出允许读取的文件、文档、日志、输出样例或测试结果。"
  boundaries: "明确不得修改、不得发布、不得替主代理决策的内容。"
  required_output: "列出必须返回的工件格式。"
  acceptance: "说明主代理如何验收该子任务结果。"
  unknowns: "要求显式列出待确认问题。"
